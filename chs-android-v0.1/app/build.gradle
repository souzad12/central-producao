plugins { id 'com.android.application' }

android {
  namespace 'com.churchhistorystudio.app'
  compileSdk 35
  defaultConfig {
    applicationId 'com.churchhistorystudio.app.v051'
    minSdk 26
    targetSdk 35
    versionCode 51
    versionName '0.5.1'
  }
  sourceSets {
    main { manifest.srcFile 'src/main/AndroidManifestStable.xml' }
  }
}

def stableSources = [
  'ai_patch_v03.js','writer_patch_v04.js','anti_repeat_patch_v041.js','anti_repeat_ui_v041.js',
  'tts_ultrastrict_patch_v042.js','duration_guard_v044.js','style_router_v045.js','provider_vault_v046.js',
  'lifecycle_migration_v046.js','ui_delete_v047.js','editorial_trash_v048.js','native_csv_v049.js','stable_finalize_v050.js'
]

tasks.register('generateStableBundle') {
  def assetsDir=file('src/main/assets')
  def output=file('src/main/assets/stable_bundle_v050.js')
  inputs.files(stableSources.collect { new File(assetsDir,it) })
  outputs.file(output)
  doLast {
    output.setText('/* CHS ANDROID v0.5.1 STABLE */\n','UTF-8')
    stableSources.each { name ->
      def source=new File(assetsDir,name)
      if(!source.exists()) throw new GradleException('Fonte ausente: '+name)
      output.append('\n/* '+name+' */\n'+source.getText('UTF-8')+'\n;\n','UTF-8')
    }
    output.append('''
;(function(){
var css=document.createElement('style');
css.textContent='html.chs-light{--bg:#f5f2eb;--panel:#fff;--panel2:#f0ece3;--line:#d8d1c4;--gold:#9f742c;--muted:#6e6960;--text:#1c1b18;color-scheme:light}html.chs-light body{background:#f5f2eb;color:#1c1b18}html.chs-light .top{background:#faf8f3}html.chs-light aside{background:#f7f4ed}html.chs-light .nav{color:#494641}html.chs-light .nav.active{background:#e8e2d7;color:#111}html.chs-light .btn{background:#eee9df;color:#222;border-color:#cfc7ba}html.chs-light .btn.primary{background:#9f742c;color:#fff}html.chs-light input,html.chs-light select,html.chs-light textarea{background:#fff!important;color:#222!important}html.chs-light .syn{color:#504d47}html.chs-light .modal{background:#fff;color:#222}html.chs-light .field,html.chs-light .act,html.chs-light .scene,html.chs-light .claim{background:#f2eee6;color:#222}';
document.head.appendChild(css);
function mode(){try{return NativeStore.get('ui_theme')||'dark'}catch(e){return 'dark'}}
window.setChsTheme=function(v){if(v!=='light')v='dark';try{NativeStore.set('ui_theme',v)}catch(e){}document.documentElement.classList.toggle('chs-light',v==='light')};
setChsTheme(mode());
var old=window.renderSettings;if(typeof old==='function')window.renderSettings=function(m){old(m);var d=document.createElement('div');d.className='setting';d.innerHTML='<h3>Aparência</h3><p>Tema da interface.</p><button class="btn" id="themeDark">Escuro</button> <button class="btn" id="themeLight">Claro</button>';m.appendChild(d);d.querySelector('#themeDark').onclick=function(){setChsTheme('dark');render()};d.querySelector('#themeLight').onclick=function(){setChsTheme('light');render()};};
})();
''','UTF-8')
  }
}

tasks.named('preBuild').configure { dependsOn 'generateStableBundle' }
