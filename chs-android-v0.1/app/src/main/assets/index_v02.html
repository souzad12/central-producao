<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Church History Studio</title><style>
:root{color-scheme:dark;--bg:#111;--panel:#1b1b1b;--panel2:#242424;--line:#353535;--gold:#cfb06d;--muted:#aaa;--text:#f3f3f3;--green:#8fdda3;--red:#e48787}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,sans-serif}.top{position:sticky;top:0;z-index:5;padding:17px 22px;background:#171717;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;font-size:20px}.sub{font-size:11px;color:var(--gold);letter-spacing:.12em}.layout{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 68px)}aside{border-right:1px solid var(--line);padding:16px;background:#161616}.nav{width:100%;padding:12px;margin:4px 0;border:0;border-radius:10px;background:transparent;color:#ddd;text-align:left}.nav.active,.nav:hover{background:#292929;color:#fff}main{padding:24px;max-width:1500px;width:100%}.hero{display:flex;justify-content:space-between;gap:12px;align-items:end}.hero h1{margin:0;font-size:28px}.hero p{color:var(--muted);margin:5px 0 0}.btn,.filebtn{display:inline-block;border:1px solid #4b4b4b;border-radius:9px;padding:11px 14px;background:#292929;color:#fff;font-weight:700}.btn.primary,.filebtn{background:var(--gold);color:#111;border-color:var(--gold)}.btn.danger{border-color:#693b3b;color:#efb0b0}input[type=file]{display:none}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.metric{background:var(--panel);border:1px solid var(--line);padding:16px;border-radius:12px}.metric b{font-size:24px;display:block}.metric span{color:var(--muted)}.filters{display:grid;grid-template-columns:1fr 210px 190px;gap:10px;margin-bottom:16px}.filters input,.filters select,.form input,.form select,.form textarea{background:#202020;border:1px solid #3a3a3a;color:#fff;border-radius:9px;padding:11px;width:100%}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}.card{background:var(--panel);border:1px solid var(--line);padding:16px;border-radius:13px}.code{color:var(--gold);font-weight:800;font-size:12px}.card h3{margin:8px 0}.meta{color:#999;font-size:12px}.syn{color:#ccc;line-height:1.45;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}.actions{display:flex;gap:8px;margin-top:13px}.actions button{flex:1}.empty{padding:40px;border:1px dashed #444;border-radius:12px;text-align:center;color:#999}.toast{position:fixed;right:18px;bottom:18px;background:#2a2a2a;border:1px solid #555;padding:12px 16px;border-radius:10px;z-index:30;max-width:420px}.overlay{position:fixed;inset:0;background:#000b;z-index:20;display:grid;place-items:center;padding:18px}.modal{max-width:780px;width:100%;max-height:90vh;overflow:auto;background:#1d1d1d;border:1px solid #444;border-radius:15px;padding:20px}.modal h2{margin:4px 0 14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{background:#242424;padding:12px;border-radius:9px}.field b,.label{display:block;color:var(--gold);font-size:12px;margin-bottom:5px}.wide{grid-column:1/-1}.acts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.act{background:#242424;border:1px solid #333;padding:10px;border-radius:9px}.close{float:right;background:none;border:0;color:#fff;font-size:24px}.status{display:inline-block;padding:4px 8px;border-radius:999px;background:#233b2a;color:var(--green);font-size:11px;font-weight:800}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#303030;color:#ccc;font-size:11px;margin-right:4px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form .full{grid-column:1/-1}.form textarea{min-height:100px;resize:vertical}.setting{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}.setting h3{margin-top:0}.ok{color:var(--green)}.warning{color:#e5c77d}.footer-note{color:#777;font-size:11px;margin-top:26px}@media(max-width:820px){.layout{grid-template-columns:1fr}aside{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}.nav{min-width:max-content}.metrics{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr}.hero{align-items:start;flex-direction:column}.row,.acts,.form{grid-template-columns:1fr}.wide,.form .full{grid-column:auto}main{padding:16px}}
</style></head><body>
<header class="top"><div><div class="brand">Church History Studio</div><div class="sub">SHOWRUNNER HISTÓRICO · ANDROID v0.2</div></div><div id="topStatus">SQLITE NATIVE</div></header>
<div class="layout"><aside><button class="nav active" data-tab="catalog">▰ Banco de Episódios</button><button class="nav" data-tab="production">▣ Em Produção</button><button class="nav" data-tab="characters">♟ Personagens</button><button class="nav" data-tab="canon">▤ Canon Histórico</button><button class="nav" data-tab="settings">⚙ Configurações</button></aside><main id="main"></main></div><div id="overlay"></div><div id="toast"></div>
<script>
const SEED=[
{code:'HAC-S10-001',century:'Século X a.C.',category:'Monarquia',theme:'Jerusalém e Davi',title:'A cidade que Davi escolheu: por que Jerusalém virou o centro do reino?',synopsis:'Davi conquista Jerusalém e transforma uma cidade de fronteira em centro político de seu reino. O episódio investiga o que as fontes bíblicas afirmam, o que a arqueologia consegue sustentar e por que a escolha de Jerusalém alterou a história de Judá.'},
{code:'HAC-S10-004',century:'Século X a.C.',category:'Crise dinástica',theme:'Revolta de Absalão',title:'O filho que tomou a capital: a revolta de Absalão contra Davi',synopsis:'Uma crise dentro da casa real se transforma em guerra pelo trono. O episódio acompanha a ascensão de Absalão, a fuga de Davi e o preço político e familiar da disputa, distinguindo o relato textual de reconstruções históricas possíveis.'},
{code:'HAC-S10-005',century:'Século X a.C.',category:'Sucessão',theme:'Adonias e Salomão',title:'Dois herdeiros, um trono: a sucessão que quase partiu a casa de Davi',synopsis:'Com Davi envelhecido, a sucessão se torna uma corrida entre facções rivais. O episódio acompanha as alianças em torno de Adonias e Salomão e examina como um problema de família tornou-se uma disputa sobre continuidade dinástica e poder.'},
{code:'HAC-S10-021',century:'Século X a.C.',category:'Investigação histórica',theme:'Monarquia Unida',title:'Existiu mesmo um império de Davi e Salomão? O julgamento do século X',synopsis:'Bíblia, arqueologia e cronologia entram em tensão. O episódio apresenta as principais linhas do debate sobre a escala da chamada Monarquia Unida, sem transformar hipótese acadêmica em certeza.'},
{code:'HAC-S10-030',century:'Século X a.C.',category:'Investigação histórica',theme:'Cronologia e arqueologia',title:'Um século no banco dos réus: Bíblia, radiocarbono e a disputa pelo século X a.C.',synopsis:'Datas, camadas arqueológicas e leituras do texto bíblico produzem cronologias concorrentes. O episódio transforma a disputa metodológica em investigação histórica sobre aquilo que realmente podemos afirmar a respeito do século X a.C.'}
];
const KEYS={catalog:'catalog',production:'production',characters:'characters',canon:'canon'};let tab='catalog',search='',century='',ns='';
function nativeGet(k){try{return window.NativeStore&&NativeStore.get(k)}catch{return null}}function load(k,d){try{let raw=nativeGet(k);if(raw)return JSON.parse(raw);let old=localStorage.getItem('chs_'+k+'_v02');return old?JSON.parse(old):d}catch{return d}}function put(k,v){let raw=JSON.stringify(v);try{if(window.NativeStore)NativeStore.set(k,raw)}catch{}try{localStorage.setItem('chs_'+k+'_v02',raw)}catch{}}function persist(){put(KEYS.catalog,catalog);put(KEYS.production,production);put(KEYS.characters,characters);put(KEYS.canon,canon)}
let catalog=load(KEYS.catalog,SEED),production=load(KEYS.production,[]),characters=load(KEYS.characters,[]),canon=load(KEYS.canon,[]);
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function flash(m){document.getElementById('toast').innerHTML=`<div class="toast">${esc(m)}</div>`;setTimeout(()=>document.getElementById('toast').innerHTML='',3600)}function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function csvLine(line){let a=[],v='',q=false;for(let i=0;i<line.length;i++){let c=line[i];if(c==='"'){if(q&&line[i+1]==='"'){v+='"';i++}else q=!q}else if(c===','&&!q){a.push(v);v=''}else v+=c}a.push(v);return a}function norm(s){return String(s||'').replace(/^\uFEFF/,'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ')}
function importCSV(text){text=String(text).replace(/^\uFEFF/,'');let lines=text.split(/\r?\n/).filter(x=>x.trim());if(lines.length<2)throw Error('CSV vazio.');let h=csvLine(lines[0]).map(norm);let ix=(...names)=>{for(let n of names){let i=h.indexOf(norm(n));if(i>=0)return i}return -1};let ci=ix('Código','Codigo','code'),ti=ix('Título','Titulo','title'),th=ix('Tema','theme'),si=ix('Sinopse','synopsis'),ce=ix('Século','Seculo'),ca=ix('Categoria');if(ci<0)throw Error('Coluna Código não encontrada.');let map=new Map(catalog.map(x=>[x.code,x])),ins=0,upd=0;for(let l of lines.slice(1)){let r=csvLine(l),code=(r[ci]||'').trim().toUpperCase();if(!/^(HC|HAC)-S\d{1,2}-\d{3}$/.test(code))continue;let old=map.get(code)||{};map.set(code,{...old,code,title:(r[ti]||r[th]||old.title||code).trim(),theme:(r[th]||old.theme||'').trim(),synopsis:(r[si]||old.synopsis||'').trim(),century:(r[ce]||old.century||'').trim(),category:(r[ca]||old.category||'').trim()});old.code?upd++:ins++}if(!ins&&!upd)throw Error('Nenhum código HC/HAC válido encontrado.');catalog=[...map.values()];persist();flash(`Importação: ${ins} novos, ${upd} atualizados.`);render()}
function render(){document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let m=document.getElementById('main');if(tab==='catalog')renderCatalog(m);else if(tab==='production')renderProduction(m);else if(tab==='characters')renderCharacters(m);else if(tab==='canon')renderCanon(m);else renderSettings(m)}
function renderCatalog(m){let cents=[...new Set(catalog.map(x=>x.century).filter(Boolean))].sort();let f=catalog.filter(e=>(!century||e.century===century)&&(!ns||e.code.startsWith(ns+'-'))&&(!search||(`${e.code} ${e.title} ${e.theme}`).toLowerCase().includes(search.toLowerCase())));m.innerHTML=`<section class="hero"><div><h1>Banco de Episódios</h1><p>HC + HAC · catálogo em SQLite nativo.</p></div><label class="filebtn">Importar CSV<input id="csv" type="file" accept=".csv,text/csv"></label></section><section class="metrics"><div class="metric"><b>${catalog.length}</b><span>episódios</span></div><div class="metric"><b>${cents.length}</b><span>séculos</span></div><div class="metric"><b>${production.length}</b><span>em produção</span></div><div class="metric"><b>${catalog.filter(x=>x.code.startsWith('HAC-')).length}</b><span>Antes da Igreja</span></div></section><section class="filters"><input id="q" value="${esc(search)}" placeholder="Buscar código, tema ou título"><select id="cent"><option value="">Todos os séculos</option>${cents.map(c=>`<option ${c===century?'selected':''}>${esc(c)}</option>`).join('')}</select><select id="ns"><option value="">HC + HAC</option><option value="HAC" ${ns==='HAC'?'selected':''}>Antes da Igreja</option><option value="HC" ${ns==='HC'?'selected':''}>História da Igreja</option></select></section><section class="grid">${f.map(card).join('')}</section>`;q.oninput=e=>{search=e.target.value;render()};cent.onchange=e=>{century=e.target.value;render()};document.getElementById('ns').onchange=e=>{ns=e.target.value;render()};}
function card(e){return `<article class="card"><span class="code">${esc(e.code)}</span><h3>${esc(e.title)}</h3><p class="meta">${esc(e.century)} · ${esc(e.category)}</p><p class="syn">${esc(e.synopsis)}</p><div class="actions"><button class="btn" onclick="detail('${e.code}')">Ver pauta</button><button class="btn primary" onclick="prepare('${e.code}')">⚡ Preparar</button></div></article>`}
function detail(code){let e=catalog.find(x=>x.code===code);overlay.innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><button class="close" onclick="closeModal()">×</button><span class="code">${e.code}</span><h2>${esc(e.title)}</h2><div class="row"><div class="field"><b>Século</b>${esc(e.century)}</div><div class="field"><b>Categoria</b>${esc(e.category)}</div><div class="field wide"><b>Sinopse</b>${esc(e.synopsis)}</div></div><div class="actions"><button class="btn" onclick="closeModal()">Fechar</button><button class="btn primary" onclick="closeModal();prepare('${e.code}')">⚡ Preparar Episódio</button></div></div></div>`}
function prepare(code){let e=catalog.find(x=>x.code===code),p={code:e.code,title:e.title,createdAt:new Date().toISOString(),acts:[{title:'ATO I — O conflito',minutes:10},{title:'ATO II — Pressão',minutes:12},{title:'ATO III — Crise',minutes:12},{title:'ATO IV — Consequências',minutes:12},{title:'ATO V — Clímax',minutes:10},{title:'EPÍLOGO — Payoff',minutes:4}]};let i=production.findIndex(x=>x.code===code);i>=0?production[i]=p:production.push(p);persist();flash('Episódio preparado e salvo no SQLite.');tab='production';render()}
function renderProduction(m){m.innerHTML=`<section class="hero"><div><h1>Episódios em Produção</h1><p>Preparações persistidas no banco nativo.</p></div></section>${production.length?`<section class="grid">${production.map(projectCard).join('')}</section>`:'<div class="empty">Nenhum episódio preparado ainda.</div>'}`}
function projectCard(e){return `<article class="card"><span class="code">${e.code}</span> <span class="status">PREPARADO</span><h3>${esc(e.title)}</h3><p class="meta">60 min · Narrador único · 5 atos + epílogo</p><div class="acts">${e.acts.map(a=>`<div class="act"><b>${a.title}</b><br><small>${a.minutes} min</small></div>`).join('')}</div></article>`}
function renderCharacters(m){m.innerHTML=`<section class="hero"><div><h1>Personagens</h1><p>Universo compartilhado entre episódios.</p></div><button class="btn primary" onclick="editCharacter()">+ Novo personagem</button></section><section class="metrics"><div class="metric"><b>${characters.length}</b><span>personagens</span></div><div class="metric"><b>${characters.filter(x=>x.type==='Histórico').length}</b><span>históricos</span></div><div class="metric"><b>${characters.filter(x=>x.type==='Composto').length}</b><span>compostos</span></div><div class="metric"><b>${characters.filter(x=>x.type==='Ficcional').length}</b><span>ficcionais</span></div></section>${characters.length?`<section class="grid">${characters.map(charCard).join('')}</section>`:'<div class="empty">Nenhum personagem cadastrado. Cadastre personagens históricos, compostos ou ficcionais com distinção explícita.</div>'}`}
function charCard(c){return `<article class="card"><span class="code">${esc(c.type)}</span><h3>${esc(c.name)}</h3><p class="meta">${esc(c.period||'Período não informado')}</p><p>${esc(c.description||'')}</p>${c.aliases?`<span class="pill">Aliases: ${esc(c.aliases)}</span>`:''}<div class="actions"><button class="btn" onclick="editCharacter('${c.id}')">Editar</button><button class="btn danger" onclick="deleteCharacter('${c.id}')">Excluir</button></div></article>`}
function editCharacter(cid=''){let c=characters.find(x=>x.id===cid)||{id:'',name:'',type:'Histórico',period:'',aliases:'',description:'',notes:''};overlay.innerHTML=`<div class="overlay"><div class="modal"><button class="close" onclick="closeModal()">×</button><h2>${cid?'Editar':'Novo'} personagem</h2><div class="form"><label><span class="label">Nome</span><input id="f_name" value="${esc(c.name)}"></label><label><span class="label">Tipo</span><select id="f_type"><option ${c.type==='Histórico'?'selected':''}>Histórico</option><option ${c.type==='Composto'?'selected':''}>Composto</option><option ${c.type==='Ficcional'?'selected':''}>Ficcional</option></select></label><label><span class="label">Período / estado</span><input id="f_period" value="${esc(c.period)}" placeholder="Ex.: Jerusalém, c. 1000 a.C."></label><label><span class="label">Aliases</span><input id="f_aliases" value="${esc(c.aliases)}"></label><label class="full"><span class="label">Descrição histórica/visual</span><textarea id="f_desc">${esc(c.description)}</textarea></label><label class="full"><span class="label">Notas de rigor/continuidade</span><textarea id="f_notes">${esc(c.notes)}</textarea></label></div><div class="actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveCharacter('${cid}')">Salvar</button></div></div></div>`}
function saveCharacter(cid){let obj={id:cid||id(),name:f_name.value.trim(),type:f_type.value,period:f_period.value.trim(),aliases:f_aliases.value.trim(),description:f_desc.value.trim(),notes:f_notes.value.trim()};if(!obj.name)return flash('Informe o nome.');let i=characters.findIndex(x=>x.id===cid);i>=0?characters[i]=obj:characters.push(obj);persist();closeModal();render();flash('Personagem salvo no SQLite.')}function deleteCharacter(cid){if(!confirm('Excluir este personagem?'))return;characters=characters.filter(x=>x.id!==cid);persist();render()}
function renderCanon(m){m.innerHTML=`<section class="hero"><div><h1>Canon Histórico</h1><p>Lugares, instituições, documentos, eventos, práticas e conceitos reutilizáveis.</p></div><button class="btn primary" onclick="editCanon()">+ Novo item de Canon</button></section><section class="metrics"><div class="metric"><b>${canon.length}</b><span>itens</span></div><div class="metric"><b>${canon.filter(x=>x.verification==='VERIFIED').length}</b><span>verificados</span></div><div class="metric"><b>${canon.filter(x=>x.verification==='PENDING').length}</b><span>pendentes</span></div><div class="metric"><b>${canon.filter(x=>x.verification==='CONFLICTING').length}</b><span>conflitantes</span></div></section>${canon.length?`<section class="grid">${canon.map(canonCard).join('')}</section>`:'<div class="empty">Nenhum item de Canon cadastrado.</div>'}`}
function canonCard(c){return `<article class="card"><span class="code">${esc(c.kind)}</span> <span class="pill">${esc(c.verification)}</span><h3>${esc(c.title)}</h3><p class="meta">${esc(c.period||'Período não informado')}</p><p>${esc(c.description||'')}</p><div class="actions"><button class="btn" onclick="editCanon('${c.id}')">Editar</button><button class="btn danger" onclick="deleteCanon('${c.id}')">Excluir</button></div></article>`}
function editCanon(cid=''){let c=canon.find(x=>x.id===cid)||{id:'',title:'',kind:'Lugar',period:'',verification:'PENDING',description:'',notes:''};overlay.innerHTML=`<div class="overlay"><div class="modal"><button class="close" onclick="closeModal()">×</button><h2>${cid?'Editar':'Novo'} item de Canon</h2><div class="form"><label><span class="label">Título</span><input id="c_title" value="${esc(c.title)}"></label><label><span class="label">Tipo</span><select id="c_kind">${['Lugar','Instituição','Documento','Evento','Prática','Conceito'].map(x=>`<option ${c.kind===x?'selected':''}>${x}</option>`).join('')}</select></label><label><span class="label">Período</span><input id="c_period" value="${esc(c.period)}"></label><label><span class="label">Verificação</span><select id="c_ver"><option ${c.verification==='PENDING'?'selected':''}>PENDING</option><option ${c.verification==='VERIFIED'?'selected':''}>VERIFIED</option><option ${c.verification==='CONFLICTING'?'selected':''}>CONFLICTING</option></select></label><label class="full"><span class="label">Descrição</span><textarea id="c_desc">${esc(c.description)}</textarea></label><label class="full"><span class="label">Fontes / notas de rigor</span><textarea id="c_notes">${esc(c.notes)}</textarea></label></div><div class="actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveCanon('${cid}')">Salvar</button></div></div></div>`}
function saveCanon(cid){let obj={id:cid||id(),title:c_title.value.trim(),kind:c_kind.value,period:c_period.value.trim(),verification:c_ver.value,description:c_desc.value.trim(),notes:c_notes.value.trim()};if(!obj.title)return flash('Informe o título.');let i=canon.findIndex(x=>x.id===cid);i>=0?canon[i]=obj:canon.push(obj);persist();closeModal();render();flash('Canon salvo no SQLite.')}function deleteCanon(cid){if(!confirm('Excluir este item de Canon?'))return;canon=canon.filter(x=>x.id!==cid);persist();render()}
function renderSettings(m){let engine='Armazenamento local';try{if(window.NativeStore)engine=NativeStore.storageEngine()}catch{}m.innerHTML=`<section class="hero"><div><h1>Configurações</h1><p>Persistência e segurança do projeto.</p></div></section><div class="setting"><h3>Banco de dados</h3><p class="ok">● ${esc(engine)}</p><p>Catálogo, produção, personagens e Canon são gravados no banco interno do aplicativo.</p></div><div class="setting"><h3>Backup portátil</h3><p>Exporte tudo para um arquivo JSON em Downloads. Esse arquivo pode ser restaurado depois de instalar outra versão do APK.</p><div class="toolbar"><button class="btn primary" onclick="exportBackup()">Exportar backup</button><button class="btn" onclick="importBackup()">Restaurar backup</button></div></div><div class="setting"><h3>Estado atual</h3><p>${catalog.length} episódios · ${production.length} em produção · ${characters.length} personagens · ${canon.length} itens de Canon.</p></div>`}
function exportBackup(){let pack={format:'CHS_BACKUP',version:2,exportedAt:new Date().toISOString(),catalog,production,characters,canon};try{if(window.NativeStore)NativeStore.exportBackup(JSON.stringify(pack));else throw Error('ponte Android indisponível')}catch(e){flash('Não foi possível exportar: '+e.message)}}function importBackup(){if(!confirm('Restaurar um backup substituirá os dados atuais. Continuar?'))return;try{NativeStore.importBackup()}catch(e){flash('Ponte Android indisponível.')}}function restoreBackupFromNative(text){let p=JSON.parse(text);if(p.format!=='CHS_BACKUP')throw Error('formato CHS_BACKUP não encontrado');if(!Array.isArray(p.catalog)||!Array.isArray(p.production)||!Array.isArray(p.characters)||!Array.isArray(p.canon))throw Error('estrutura incompleta');catalog=p.catalog;production=p.production;characters=p.characters;canon=p.canon;persist();render();flash('Backup restaurado com sucesso.')}
function closeModal(){overlay.innerHTML=''}document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});persist();render();
</script></body></html>
