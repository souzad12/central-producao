<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Church History Studio</title><style>
:root{color-scheme:dark;--bg:#111;--panel:#1b1b1b;--panel2:#242424;--line:#343434;--gold:#c8a96b;--muted:#aaa;--text:#f2f2f2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,sans-serif}.top{position:sticky;top:0;z-index:5;padding:18px 22px;background:#171717;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;font-size:20px}.sub{font-size:11px;color:var(--gold);letter-spacing:.12em}.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 68px)}aside{border-right:1px solid var(--line);padding:16px;background:#161616}.nav{width:100%;padding:12px;margin:4px 0;border:0;border-radius:10px;background:transparent;color:#ddd;text-align:left}.nav.active,.nav:hover{background:#272727;color:#fff}main{padding:24px;max-width:1400px;width:100%}.hero{display:flex;justify-content:space-between;gap:12px;align-items:end}.hero h1{margin:0;font-size:27px}.hero p{color:var(--muted);margin:5px 0 0}.btn,.filebtn{display:inline-block;border:1px solid #4b4b4b;border-radius:9px;padding:11px 14px;background:#292929;color:#fff;font-weight:700}.btn.primary,.filebtn{background:var(--gold);color:#111;border-color:var(--gold)}input[type=file]{display:none}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.metric{background:var(--panel);border:1px solid var(--line);padding:16px;border-radius:12px}.metric b{font-size:24px;display:block}.metric span{color:var(--muted)}.filters{display:grid;grid-template-columns:1fr 190px 190px;gap:10px;margin-bottom:16px}.filters input,.filters select{background:#202020;border:1px solid #3a3a3a;color:#fff;border-radius:9px;padding:11px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}.card{background:var(--panel);border:1px solid var(--line);padding:16px;border-radius:13px}.code{color:var(--gold);font-weight:800;font-size:12px}.card h3{margin:8px 0}.meta{color:#999;font-size:12px}.syn{color:#ccc;line-height:1.45;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}.actions{display:flex;gap:8px;margin-top:13px}.actions button{flex:1}.empty{padding:40px;border:1px dashed #444;border-radius:12px;text-align:center;color:#999}.toast{position:fixed;right:18px;bottom:18px;background:#2a2a2a;border:1px solid #555;padding:12px 16px;border-radius:10px;z-index:30}.overlay{position:fixed;inset:0;background:#000b;z-index:20;display:grid;place-items:center;padding:18px}.modal{max-width:760px;width:100%;max-height:90vh;overflow:auto;background:#1d1d1d;border:1px solid #444;border-radius:15px;padding:20px}.modal h2{margin:4px 0 14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{background:#242424;padding:12px;border-radius:9px}.field b{display:block;color:var(--gold);font-size:12px;margin-bottom:5px}.wide{grid-column:1/-1}.acts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.act{background:#242424;border:1px solid #333;padding:10px;border-radius:9px}.close{float:right;background:none;border:0;color:#fff;font-size:24px}.status{display:inline-block;padding:4px 8px;border-radius:999px;background:#233b2a;color:#8fdda3;font-size:11px;font-weight:800}.footer-note{color:#777;font-size:11px;margin-top:26px}@media(max-width:800px){.layout{grid-template-columns:1fr}aside{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}.nav{min-width:max-content}.metrics{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr}.hero{align-items:start;flex-direction:column}.row,.acts{grid-template-columns:1fr}.wide{grid-column:auto}main{padding:16px}}
</style></head><body>
<header class="top"><div><div class="brand">Church History Studio</div><div class="sub">SHOWRUNNER HISTÓRICO · ANDROID v0.1</div></div><div id="topStatus">OFFLINE-FIRST</div></header>
<div class="layout"><aside><button class="nav active" data-tab="catalog">▰ Banco de Episódios</button><button class="nav" data-tab="production">▣ Em Produção</button><button class="nav" data-tab="characters">♟ Personagens</button><button class="nav" data-tab="canon">▤ Canon Histórico</button><button class="nav" data-tab="settings">⚙ Configurações</button></aside><main id="main"></main></div><div id="overlay"></div><div id="toast"></div>
<script>
const SEED=[
{code:'HAC-S10-001',century:'Século X a.C.',category:'Monarquia',theme:'Jerusalém e Davi',title:'A cidade que Davi escolheu: por que Jerusalém virou o centro do reino?',synopsis:'Davi conquista Jerusalém e transforma uma cidade de fronteira em centro político de seu reino. O episódio investiga o que as fontes bíblicas afirmam, o que a arqueologia consegue sustentar e por que a escolha de Jerusalém alterou a história de Judá.'},
{code:'HAC-S10-004',century:'Século X a.C.',category:'Crise dinástica',theme:'Revolta de Absalão',title:'O filho que tomou a capital: a revolta de Absalão contra Davi',synopsis:'Uma crise dentro da casa real se transforma em guerra pelo trono. O episódio acompanha a ascensão de Absalão, a fuga de Davi e o preço político e familiar da disputa, distinguindo o relato textual de reconstruções históricas possíveis.'},
{code:'HAC-S10-005',century:'Século X a.C.',category:'Sucessão',theme:'Adonias e Salomão',title:'Dois herdeiros, um trono: a sucessão que quase partiu a casa de Davi',synopsis:'Com Davi envelhecido, a sucessão se torna uma corrida entre facções rivais. O episódio acompanha as alianças em torno de Adonias e Salomão e examina como um problema de família tornou-se uma disputa sobre continuidade dinástica e poder.'},
{code:'HAC-S10-021',century:'Século X a.C.',category:'Investigação histórica',theme:'Monarquia Unida',title:'Existiu mesmo um império de Davi e Salomão? O julgamento do século X',synopsis:'Bíblia, arqueologia e cronologia entram em tensão. O episódio apresenta as principais linhas do debate sobre a escala da chamada Monarquia Unida, sem transformar hipótese acadêmica em certeza.'},
{code:'HAC-S10-030',century:'Século X a.C.',category:'Investigação histórica',theme:'Cronologia e arqueologia',title:'Um século no banco dos réus: Bíblia, radiocarbono e a disputa pelo século X a.C.',synopsis:'Datas, camadas arqueológicas e leituras do texto bíblico produzem cronologias concorrentes. O episódio transforma a disputa metodológica em investigação histórica sobre aquilo que realmente podemos afirmar a respeito do século X a.C.'}
];
const KEY='chs_catalog_v01', PROD='chs_production_v01';let tab='catalog',search='',century='',ns='';
let catalog=load(KEY,SEED),production=load(PROD,[]);function load(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}}function save(){localStorage.setItem(KEY,JSON.stringify(catalog));localStorage.setItem(PROD,JSON.stringify(production))}function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function flash(m){document.getElementById('toast').innerHTML=`<div class="toast">${esc(m)}</div>`;setTimeout(()=>toast.innerHTML='',3200)}
function csvLine(line){let a=[],v='',q=false;for(let i=0;i<line.length;i++){let c=line[i];if(c==='"'){if(q&&line[i+1]==='"'){v+='"';i++}else q=!q}else if(c===','&&!q){a.push(v);v=''}else v+=c}a.push(v);return a}function norm(s){return String(s||'').replace(/^\uFEFF/,'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ')}function importCSV(text){text=String(text).replace(/^\uFEFF/,'');let lines=text.split(/\r?\n/).filter(x=>x.trim());if(lines.length<2)throw Error('CSV vazio.');let h=csvLine(lines[0]).map(norm);let ix=(...names)=>{for(let n of names){let i=h.indexOf(norm(n));if(i>=0)return i}return -1};let ci=ix('Código','Codigo','code'),ti=ix('Título','Titulo','title'),th=ix('Tema','theme'),si=ix('Sinopse','synopsis'),ce=ix('Século','Seculo'),ca=ix('Categoria');if(ci<0)throw Error('Coluna Código não encontrada.');let map=new Map(catalog.map(x=>[x.code,x])),ins=0,upd=0;for(let l of lines.slice(1)){let r=csvLine(l),code=(r[ci]||'').trim().toUpperCase();if(!/^(HC|HAC)-S\d{1,2}-\d{3}$/.test(code))continue;let old=map.get(code)||{};map.set(code,{...old,code,title:(r[ti]||r[th]||old.title||code).trim(),theme:(r[th]||old.theme||'').trim(),synopsis:(r[si]||old.synopsis||'').trim(),century:(r[ce]||old.century||'').trim(),category:(r[ca]||old.category||'').trim()});old.code?upd++:ins++}if(!ins&&!upd)throw Error('Nenhum código HC/HAC válido encontrado.');catalog=[...map.values()];save();flash(`Importação: ${ins} novos, ${upd} atualizados.`);render()}
function render(){document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let m=document.getElementById('main');if(tab==='catalog'){let cents=[...new Set(catalog.map(x=>x.century).filter(Boolean))].sort();let f=catalog.filter(e=>(!century||e.century===century)&&(!ns||e.code.startsWith(ns+'-'))&&(!search||(`${e.code} ${e.title} ${e.theme}`).toLowerCase().includes(search.toLowerCase())));m.innerHTML=`<section class="hero"><div><h1>Banco de Episódios</h1><p>HC + HAC · catálogo local e importação incremental.</p></div><label class="filebtn">Importar CSV<input id="csv" type="file" accept=".csv,text/csv"></label></section><section class="metrics"><div class="metric"><b>${catalog.length}</b><span>episódios</span></div><div class="metric"><b>${cents.length}</b><span>séculos</span></div><div class="metric"><b>${production.length}</b><span>em produção</span></div><div class="metric"><b>${catalog.filter(x=>x.code.startsWith('HAC-')).length}</b><span>Antes da Igreja</span></div></section><section class="filters"><input id="q" value="${esc(search)}" placeholder="Buscar código, tema ou título"><select id="cent"><option value="">Todos os séculos</option>${cents.map(c=>`<option ${c===century?'selected':''}>${esc(c)}</option>`).join('')}</select><select id="ns"><option value="">HC + HAC</option><option value="HAC" ${ns==='HAC'?'selected':''}>Antes da Igreja</option><option value="HC" ${ns==='HC'?'selected':''}>História da Igreja</option></select></section><section class="grid">${f.map(card).join('')}</section><div class="footer-note">Os cinco registros iniciais são amostras. Importe seu CSV para carregar o banco completo.</div>`;q.oninput=e=>{search=e.target.value;render()};cent.onchange=e=>{century=e.target.value;render()};document.getElementById('ns').onchange=e=>{ns=e.target.value;render()};csv.onchange=e=>{let file=e.target.files[0];if(file)file.text().then(importCSV).catch(x=>flash(x.message))}}else if(tab==='production'){m.innerHTML=`<section class="hero"><div><h1>Episódios em Produção</h1><p>Preparações salvas neste tablet.</p></div></section>${production.length?`<section class="grid">${production.map(projectCard).join('')}</section>`:'<div class="empty">Nenhum episódio preparado ainda.</div>'}`}else{let names={characters:'Personagens',canon:'Canon Histórico',settings:'Configurações'};m.innerHTML=`<div class="empty"><h2>${names[tab]}</h2><p>Reservado para o próximo marco Android. A v0.1 valida APK, navegação, catálogo, CSV e persistência.</p></div>`}}
function card(e){return `<article class="card"><span class="code">${esc(e.code)}</span><h3>${esc(e.title)}</h3><p class="meta">${esc(e.century)} · ${esc(e.category)}</p><p class="syn">${esc(e.synopsis)}</p><div class="actions"><button class="btn" onclick="detail('${e.code}')">Ver pauta</button><button class="btn primary" onclick="prepare('${e.code}')">⚡ Preparar</button></div></article>`}function projectCard(e){return `<article class="card"><span class="code">${e.code}</span> <span class="status">PREPARADO</span><h3>${esc(e.title)}</h3><p class="meta">60 min · Narrador único · 5 atos + epílogo</p><div class="acts">${e.acts.map(a=>`<div class="act"><b>${a.title}</b><br><small>${a.minutes} min</small></div>`).join('')}</div></article>`}
function detail(code){let e=catalog.find(x=>x.code===code);overlay.innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><button class="close" onclick="closeModal()">×</button><span class="code">${e.code}</span><h2>${esc(e.title)}</h2><div class="row"><div class="field"><b>Século</b>${esc(e.century)}</div><div class="field"><b>Categoria</b>${esc(e.category)}</div><div class="field wide"><b>Sinopse</b>${esc(e.synopsis)}</div></div><div class="actions"><button class="btn" onclick="closeModal()">Fechar</button><button class="btn primary" onclick="closeModal();prepare('${e.code}')">⚡ Preparar Episódio</button></div></div></div>`}function closeModal(){overlay.innerHTML=''}function prepare(code){let e=catalog.find(x=>x.code===code);overlay.innerHTML=`<div class="overlay"><div class="modal"><button class="close" onclick="closeModal()">×</button><span class="code">${e.code}</span><h2>Preparar episódio</h2><div class="row"><div class="field"><b>Duração</b>60 minutos</div><div class="field"><b>Voz</b>Narrador único</div><div class="field"><b>Estrutura</b>5 atos + epílogo</div><div class="field"><b>Estilo</b>Dostoievskiano histórico · 3/5</div><div class="field"><b>Abertura</b>Somente visual</div><div class="field"><b>Sensorialidade</b>Baixa</div></div><p style="color:#aaa">Na v0.1 esta preparação é estrutural e local. A IA entra em marco posterior.</p><div class="actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="confirmPrepare('${e.code}')">Preparar localmente</button></div></div></div>`}function confirmPrepare(code){let e=catalog.find(x=>x.code===code),acts=[['ATO I — O conflito',10],['ATO II — Pressão',12],['ATO III — Crise',12],['ATO IV — Consequências',12],['ATO V — Clímax',10],['EPÍLOGO — Payoff',4]].map((x,i)=>({number:i+1,title:x[0],minutes:x[1]}));let p={code:e.code,title:e.title,createdAt:new Date().toISOString(),acts};production=[...production.filter(x=>x.code!==code),p];save();closeModal();tab='production';flash('Episódio preparado e salvo no tablet.');render()}
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});render();
</script></body></html>
