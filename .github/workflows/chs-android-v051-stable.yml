name: Build CHS Android v0.5.2 STABLE
on:
  push:
    branches: ["chs-android-v0.5.2"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        working-directory: chs-android-v0.1
        run: gradle assembleDebug --stacktrace
      - run: cp chs-android-v0.1/app/build/outputs/apk/debug/app-debug.apk Church-History-Studio-Android-v0.5.2-STABLE.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Church-History-Studio-Android-v0.5.2-STABLE
          path: Church-History-Studio-Android-v0.5.2-STABLE.apk
