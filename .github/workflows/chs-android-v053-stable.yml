name: Build CHS Android v0.6.1 LITERARY WRITER V2
on:
  push:
    branches: ["chs-android-v0.6.1-literary-v2"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Validate Literary Writer JavaScript
        run: node --check chs-android-v0.1/app/src/main/assets/literary_writer_v2_v061.js
      - name: Build APK
        working-directory: chs-android-v0.1
        run: gradle assembleDebug --stacktrace
      - name: Validate generated stable bundle
        run: node --check chs-android-v0.1/app/src/main/assets/stable_bundle_v050.js
      - run: cp chs-android-v0.1/app/build/outputs/apk/debug/app-debug.apk Church-History-Studio-Android-v0.6.1-LITERARY-WRITER-V2.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Church-History-Studio-Android-v0.6.1-LITERARY-WRITER-V2
          path: Church-History-Studio-Android-v0.6.1-LITERARY-WRITER-V2.apk
