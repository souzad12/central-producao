name: Build CHS Android APK
on:
  push:
    branches: ["chs-android-v0.4.8"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: chs-android-v0.1
        run: gradle assembleDebug --stacktrace
      - name: Collect APK
        run: cp chs-android-v0.1/app/build/outputs/apk/debug/app-debug.apk Church-History-Studio-Android-v0.4.8-Lixeira-Editorial.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Church-History-Studio-Android-v0.4.8-Lixeira-Editorial
          path: Church-History-Studio-Android-v0.4.8-Lixeira-Editorial.apk
          if-no-files-found: error
