name: Build F2U v0.2 APKs

on:
  push:
    branches:
      - chatgpt/f2u-v020-build-20260814

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore and verify source package
        shell: bash
        run: |
          cat tmp-f2u-v020/source.part* > /tmp/f2u-v020.b64
          base64 --decode /tmp/f2u-v020.b64 > /tmp/f2u-v020.zip
          unzip -t /tmp/f2u-v020.zip
          mkdir -p buildsrc
          unzip -q /tmp/f2u-v020.zip -d buildsrc
          test -f buildsrc/F2UTextAndroid/app/build.gradle.kts
          test -f buildsrc/F2UVisualAndroid/app/build.gradle.kts
          sed -i 's/compileSdk = 37/compileSdk = 36/g' buildsrc/F2UTextAndroid/app/build.gradle.kts
          sed -i 's/compileSdk = 37/compileSdk = 36/g' buildsrc/F2UVisualAndroid/app/build.gradle.kts
          sed -i 's/version "9.2.0"/version "8.13.2"/g' buildsrc/F2UTextAndroid/build.gradle.kts
          sed -i 's/version "9.2.0"/version "8.13.2"/g' buildsrc/F2UVisualAndroid/build.gradle.kts
          python3 - <<'PY'
          from pathlib import Path
          for p in [Path('buildsrc/F2UTextAndroid/app/build.gradle.kts'), Path('buildsrc/F2UVisualAndroid/app/build.gradle.kts')]:
              s = p.read_text()
              s = s.replace('    kotlinOptions { jvmTarget = "17" }\n', '')
              replacements = {
                  'compose-bom:2026.06.00': 'compose-bom:2025.09.01',
                  'activity-compose:1.13.0': 'activity-compose:1.11.0',
                  'lifecycle-runtime-compose:2.11.0': 'lifecycle-runtime-compose:2.9.4',
                  'lifecycle-viewmodel-compose:2.11.0': 'lifecycle-viewmodel-compose:2.9.4',
                  'lifecycle-viewmodel-ktx:2.11.0': 'lifecycle-viewmodel-ktx:2.9.4',
                  'room-runtime:2.8.4': 'room-runtime:2.8.1',
                  'room-ktx:2.8.4': 'room-ktx:2.8.1',
                  'room-compiler:2.8.4': 'room-compiler:2.8.1',
                  'work-runtime-ktx:2.11.2': 'work-runtime-ktx:2.10.5',
              }
              for old, new in replacements.items():
                  s = s.replace(old, new)
              if 'jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)' not in s:
                  s += '\n\nkotlin {\n    compilerOptions {\n        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)\n    }\n}\n'
              p.write_text(s)
          PY
          python3 tmp-f2u-v020/patch_text.py buildsrc
          python3 tmp-f2u-v020/patch_visual.py buildsrc
          cat > buildsrc/F2UTextAndroid/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="shortcut_new_tts_short">Novo TTS</string>
              <string name="shortcut_new_tts_long">Novo projeto de texto</string>
              <string name="shortcut_last_project_short">Último projeto</string>
              <string name="shortcut_last_project_long">Abrir último projeto</string>
          </resources>
          EOF
          cat > buildsrc/F2UTextAndroid/app/src/main/res/xml/shortcuts.xml <<'EOF'
          <shortcuts xmlns:android="http://schemas.android.com/apk/res/android">
              <shortcut android:shortcutId="new_project" android:enabled="true" android:icon="@drawable/ic_text_mono" android:shortcutShortLabel="@string/shortcut_new_tts_short" android:shortcutLongLabel="@string/shortcut_new_tts_long">
                  <intent android:action="android.intent.action.VIEW" android:targetPackage="com.f2u.text" android:targetClass="com.f2u.text.MainActivity"><extra android:name="shortcut" android:value="new"/></intent>
              </shortcut>
              <shortcut android:shortcutId="last_project" android:enabled="true" android:icon="@drawable/ic_text_mono" android:shortcutShortLabel="@string/shortcut_last_project_short" android:shortcutLongLabel="@string/shortcut_last_project_long">
                  <intent android:action="android.intent.action.VIEW" android:targetPackage="com.f2u.text" android:targetClass="com.f2u.text.MainActivity"><extra android:name="shortcut" android:value="last"/></intent>
              </shortcut>
          </shortcuts>
          EOF
          cat > buildsrc/F2UVisualAndroid/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="shortcut_new_batch_short">Novo lote</string>
              <string name="shortcut_new_batch_long">Nova criação visual</string>
              <string name="shortcut_gallery_short">Galeria</string>
              <string name="shortcut_gallery_long">Abrir galeria recente</string>
          </resources>
          EOF
          cat > buildsrc/F2UVisualAndroid/app/src/main/res/xml/shortcuts.xml <<'EOF'
          <shortcuts xmlns:android="http://schemas.android.com/apk/res/android">
              <shortcut android:shortcutId="new_batch" android:enabled="true" android:icon="@drawable/ic_visual_mono" android:shortcutShortLabel="@string/shortcut_new_batch_short" android:shortcutLongLabel="@string/shortcut_new_batch_long">
                  <intent android:action="android.intent.action.VIEW" android:targetPackage="com.f2u.visual" android:targetClass="com.f2u.visual.MainActivity"><extra android:name="shortcut" android:value="create"/></intent>
              </shortcut>
              <shortcut android:shortcutId="gallery" android:enabled="true" android:icon="@drawable/ic_visual_mono" android:shortcutShortLabel="@string/shortcut_gallery_short" android:shortcutLongLabel="@string/shortcut_gallery_long">
                  <intent android:action="android.intent.action.VIEW" android:targetPackage="com.f2u.visual" android:targetClass="com.f2u.visual.MainActivity"><extra android:name="shortcut" android:value="gallery"/></intent>
              </shortcut>
          </shortcuts>
          EOF
          echo '--- MainActivity.kt lines 185-205 after patches ---'
          nl -ba buildsrc/F2UTextAndroid/app/src/main/java/com/f2u/text/MainActivity.kt | sed -n '185,205p'

      - name: Build F2U Text and capture log
        shell: bash
        run: |
          set +e
          cd buildsrc/F2UTextAndroid
          gradle --no-daemon :app:assembleDebug 2>&1 | tee ../../text-build.log
          code=${PIPESTATUS[0]}
          echo "$code" > ../../text-exit.txt
          exit 0

      - name: Build F2U Visual and capture log
        shell: bash
        run: |
          set +e
          cd buildsrc/F2UVisualAndroid
          gradle --no-daemon :app:assembleDebug 2>&1 | tee ../../visual-build.log
          code=${PIPESTATUS[0]}
          echo "$code" > ../../visual-exit.txt
          exit 0

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: F2U-v0.2-build-logs
          path: |
            text-build.log
            visual-build.log
            text-exit.txt
            visual-exit.txt
          if-no-files-found: warn
          retention-days: 1

      - name: Collect and verify APKs
        shell: bash
        run: |
          echo "Text exit: $(cat text-exit.txt)"
          echo "Visual exit: $(cat visual-exit.txt)"
          test "$(cat text-exit.txt)" = "0"
          test "$(cat visual-exit.txt)" = "0"
          mkdir -p out
          cp buildsrc/F2UTextAndroid/app/build/outputs/apk/debug/app-debug.apk out/F2U-Text-v0.2.0.apk
          cp buildsrc/F2UVisualAndroid/app/build/outputs/apk/debug/app-debug.apk out/F2U-Visual-v0.2.0.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose out/F2U-Text-v0.2.0.apk
          "$APKSIGNER" verify --verbose out/F2U-Visual-v0.2.0.apk
          sha256sum out/*.apk > out/SHA256SUMS.txt
          ls -lh out

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: F2U-Android-APKs-v0.2.0
          path: out/*
          if-no-files-found: error
          retention-days: 1
