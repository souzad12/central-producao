<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Notes Pro</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body { font-family: 'Inter', sans-serif; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Markdown Preview Styles (Tailwind typography simulation) */
        .prose h1 { font-size: 2em; font-weight: 800; margin-bottom: 0.5em; border-bottom: 1px solid #e2e8f0; padding-bottom: 0.3em; color: #1e293b; }
        .prose h2 { font-size: 1.5em; font-weight: 700; margin-top: 1em; margin-bottom: 0.5em; color: #334155; }
        .prose h3 { font-size: 1.25em; font-weight: 600; margin-top: 1em; margin-bottom: 0.5em; color: #475569; }
        .prose p { margin-bottom: 1em; line-height: 1.6; color: #475569; }
        .prose ul { list-style-type: disc; padding-left: 1.5em; margin-bottom: 1em; }
        .prose ol { list-style-type: decimal; padding-left: 1.5em; margin-bottom: 1em; }
        .prose blockquote { border-left: 4px solid #3b82f6; padding-left: 1em; color: #64748b; font-style: italic; background: #f8fafc; py-1; }
        .prose code { background: #f1f5f9; padding: 0.2em 0.4em; border-radius: 0.25em; font-family: monospace; font-size: 0.9em; color: #db2777; }
        .prose pre { background: #1e293b; color: #f8fafc; padding: 1em; border-radius: 0.5em; overflow-x: auto; margin-bottom: 1em; }
        .prose pre code { background: transparent; color: inherit; padding: 0; }
        .prose a { color: #2563eb; text-decoration: underline; }
        .prose img { max-width: 100%; border-radius: 0.5em; margin: 1em 0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .prose strong { font-weight: 700; color: #1e293b; }
        .prose em { font-style: italic; }
        .prose del { text-decoration: line-through; color: #94a3b8; }
        .prose table { width: 100%; border-collapse: collapse; margin-bottom: 1em; }
        .prose th, .prose td { border: 1px solid #e2e8f0; padding: 0.5em; text-align: left; }
        .prose th { background-color: #f8fafc; font-weight: 600; }

        .note-item.active { background-color: #eff6ff; border-left: 4px solid #3b82f6; }
    </style>
</head>
<body class="h-screen flex overflow-hidden bg-gray-50 text-gray-800">

    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r border-gray-200 flex flex-col flex-shrink-0 z-20 shadow-sm">
        <div class="p-4 border-b border-gray-200">
            <div class="flex items-center gap-2 mb-4 text-indigo-600">
                <i data-lucide="notebook-pen" class="w-6 h-6"></i>
                <h1 class="font-bold text-lg tracking-tight text-gray-900">MD Notes</h1>
            </div>
            <button onclick="createNewNote()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 px-4 rounded-md flex items-center justify-center gap-2 transition-all font-medium shadow-sm text-sm">
                <i data-lucide="plus" class="w-4 h-4"></i> Nova Nota
            </button>
        </div>
        
        <!-- Search -->
        <div class="p-2">
            <div class="relative">
                <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-gray-400"></i>
                <input type="text" id="searchNotes" onkeyup="renderNoteList()" placeholder="Buscar notas..." 
                    class="w-full pl-9 pr-3 py-2 bg-gray-50 border border-gray-200 rounded-md text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none transition-all">
            </div>
        </div>

        <!-- Note List -->
        <div id="noteList" class="flex-1 overflow-y-auto">
            <!-- Notes will be injected here -->
        </div>

        <div class="p-3 text-xs text-center text-gray-400 border-t border-gray-100">
            Salvo localmente no navegador
        </div>
    </aside>

    <!-- Main Area -->
    <main class="flex-1 flex flex-col min-w-0 bg-white">
        
        <!-- Toolbar -->
        <header class="h-14 border-b border-gray-200 flex items-center justify-between px-4 bg-white shadow-sm z-10">
            <div class="flex items-center gap-3 flex-1 mr-4">
                <input type="text" id="noteTitleInput" placeholder="Título da Nota" 
                    class="text-lg font-bold text-gray-800 bg-transparent border-none focus:ring-0 focus:outline-none w-full placeholder-gray-400"
                    oninput="updateCurrentNoteMeta()">
            </div>
            
            <div class="flex items-center gap-1 sm:gap-2">
                <!-- Formatting Group -->
                <div class="flex items-center bg-gray-100 rounded-lg p-1 mr-2">
                    <button onclick="formatText('**')" class="p-1.5 hover:bg-white hover:text-indigo-600 rounded text-gray-600 transition-all" title="Negrito (Ctrl+B)"><i data-lucide="bold" class="w-4 h-4"></i></button>
                    <button onclick="formatText('*')" class="p-1.5 hover:bg-white hover:text-indigo-600 rounded text-gray-600 transition-all" title="Itálico (Ctrl+I)"><i data-lucide="italic" class="w-4 h-4"></i></button>
                    <button onclick="formatText('~~')" class="p-1.5 hover:bg-white hover:text-indigo-600 rounded text-gray-600 transition-all" title="Riscado"><i data-lucide="strikethrough" class="w-4 h-4"></i></button>
                </div>

                <!-- Actions Group -->
                <button onclick="toggleFindReplace()" class="p-2 hover:bg-gray-100 rounded-md text-gray-600 transition-all relative" title="Localizar e Substituir">
                    <i data-lucide="search-code" class="w-4 h-4"></i>
                </button>
                <button onclick="copyContent()" class="p-2 hover:bg-gray-100 rounded-md text-gray-600 transition-all" title="Copiar Tudo">
                    <i data-lucide="copy" class="w-4 h-4"></i>
                </button>
                <button onclick="clearEditor()" class="p-2 hover:bg-red-50 hover:text-red-600 rounded-md text-gray-600 transition-all" title="Limpar Nota">
                    <i data-lucide="eraser" class="w-4 h-4"></i>
                </button>
                <div class="h-6 w-px bg-gray-300 mx-1"></div>
                <button onclick="saveAsFile()" class="p-2 hover:bg-green-50 hover:text-green-600 rounded-md text-gray-600 transition-all flex items-center gap-1" title="Baixar .md">
                    <i data-lucide="download" class="w-4 h-4"></i>
                    <span class="text-xs font-medium hidden sm:inline">Salvar Como</span>
                </button>
                <button onclick="deleteCurrentNote()" class="p-2 hover:bg-red-50 hover:text-red-600 rounded-md text-gray-400 transition-all" title="Excluir Nota">
                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
            </div>
        </header>

        <!-- Find & Replace Modal (Hidden by default) -->
        <div id="findReplacePanel" class="hidden bg-gray-50 border-b border-gray-200 p-3 flex items-center gap-3 animate-fade-in">
            <div class="flex flex-col sm:flex-row gap-2 w-full max-w-3xl">
                <div class="relative flex-1">
                    <i data-lucide="search" class="w-3 h-3 absolute left-3 top-3 text-gray-400"></i>
                    <input id="findInput" type="text" placeholder="Localizar..." class="w-full pl-8 p-2 text-sm border border-gray-300 rounded focus:border-indigo-500 focus:outline-none">
                </div>
                <div class="relative flex-1">
                    <i data-lucide="replace" class="w-3 h-3 absolute left-3 top-3 text-gray-400"></i>
                    <input id="replaceInput" type="text" placeholder="Substituir por..." class="w-full pl-8 p-2 text-sm border border-gray-300 rounded focus:border-indigo-500 focus:outline-none">
                </div>
                <button onclick="executeReplace()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded text-sm font-medium transition-colors">
                    Substituir Tudo
                </button>
                <button onclick="toggleFindReplace()" class="text-gray-500 hover:text-gray-700 p-2">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>
        </div>

        <!-- Editor & Preview Area -->
        <div class="flex-1 flex overflow-hidden">
            <!-- Editor -->
            <div class="w-1/2 flex flex-col border-r border-gray-200">
                <div class="bg-gray-50 px-4 py-1 text-xs font-mono text-gray-500 border-b border-gray-200 flex justify-between">
                    <span>MARKDOWN</span>
                    <span id="saveStatus" class="text-green-600 font-semibold opacity-0 transition-opacity">Salvo</span>
                </div>
                <textarea id="editor" 
                    class="flex-1 w-full p-6 bg-white resize-none focus:outline-none font-mono text-sm leading-relaxed text-gray-700" 
                    placeholder="Comece a escrever seu markdown aqui..."
                    oninput="handleInput()"></textarea>
            </div>
            
            <!-- Preview -->
            <div class="w-1/2 flex flex-col bg-white">
                <div class="bg-gray-50 px-4 py-1 text-xs font-mono text-gray-500 border-b border-gray-200">PREVIEW</div>
                <div id="preview" class="flex-1 w-full p-6 overflow-y-auto prose max-w-none">
                    <!-- Rendered HTML will appear here -->
                </div>
            </div>
        </div>
    </main>

    <script>
        // Initialize Icons
        lucide.createIcons();

        // State
        let notes = [];
        let activeNoteId = null;

        // Elements
        const editor = document.getElementById('editor');
        const preview = document.getElementById('preview');
        const titleInput = document.getElementById('noteTitleInput');
        const noteListEl = document.getElementById('noteList');
        const saveStatus = document.getElementById('saveStatus');

        // --- Lifecycle ---

        window.onload = () => {
            loadNotes();
            if (notes.length === 0) {
                createNewNote();
            } else {
                // Load the most recently modified note
                notes.sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
                setActiveNote(notes[0].id);
            }
        };

        // --- Core Functions ---

        function loadNotes() {
            const stored = localStorage.getItem('md_notes_app');
            if (stored) {
                notes = JSON.parse(stored);
            }
        }

        function saveToStorage() {
            localStorage.setItem('md_notes_app', JSON.stringify(notes));
            showSaveIndicator();
        }

        function createNewNote() {
            const newNote = {
                id: Date.now().toString(),
                title: 'Nova Nota',
                content: '# Olá Mundo\n\nComece a escrever...',
                updatedAt: new Date().toISOString()
            };
            notes.unshift(newNote);
            saveToStorage();
            renderNoteList();
            setActiveNote(newNote.id);
            
            // Focus title for easy renaming
            setTimeout(() => titleInput.select(), 100);
        }

        function setActiveNote(id) {
            activeNoteId = id;
            const note = notes.find(n => n.id === id);
            if (!note) return;

            // Update UI inputs
            titleInput.value = note.title;
            editor.value = note.content;
            
            // Update Preview
            updatePreview(note.content);
            
            // Update Sidebar Highlights
            renderNoteList();
        }

        function updateCurrentNoteMeta() {
            if (!activeNoteId) return;
            const note = notes.find(n => n.id === activeNoteId);
            
            note.title = titleInput.value || 'Sem Título';
            note.updatedAt = new Date().toISOString();
            
            saveToStorage();
            renderNoteList();
        }

        function handleInput() {
            if (!activeNoteId) return;
            const note = notes.find(n => n.id === activeNoteId);
            
            note.content = editor.value;
            note.updatedAt = new Date().toISOString();
            
            updatePreview(note.content);
            saveToStorage();
            
            // Move current note to top of list as it's most recently used
            // Only sort if we want dynamic reordering (can be jarring)
            // Let's just update the preview for now.
        }

        function updatePreview(content) {
            // Configure Marked
            preview.innerHTML = marked.parse(content);
            // Re-run highlighting or other processing if needed
        }

        function deleteCurrentNote() {
            if (!activeNoteId) return;
            if (!confirm('Tem certeza que deseja excluir esta nota?')) return;

            notes = notes.filter(n => n.id !== activeNoteId);
            saveToStorage();
            
            if (notes.length > 0) {
                setActiveNote(notes[0].id);
            } else {
                createNewNote();
            }
        }

        // --- Rendering ---

        function renderNoteList() {
            const searchTerm = document.getElementById('searchNotes').value.toLowerCase();
            noteListEl.innerHTML = '';

            notes
                .filter(n => n.title.toLowerCase().includes(searchTerm) || n.content.toLowerCase().includes(searchTerm))
                .sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt))
                .forEach(note => {
                    const div = document.createElement('div');
                    const isActive = note.id === activeNoteId;
                    const date = new Date(note.updatedAt).toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
                    
                    div.className = `note-item p-4 border-b border-gray-100 cursor-pointer hover:bg-gray-50 transition-colors ${isActive ? 'active' : ''}`;
                    div.onclick = () => setActiveNote(note.id);
                    
                    div.innerHTML = `
                        <h3 class="font-semibold text-gray-800 truncate text-sm mb-1">${note.title}</h3>
                        <p class="text-xs text-gray-500 truncate">${note.content.substring(0, 30).replace(/[#*`]/g, '')}...</p>
                        <p class="text-[10px] text-gray-400 mt-2 text-right">${date}</p>
                    `;
                    noteListEl.appendChild(div);
                });
        }

        function showSaveIndicator() {
            saveStatus.style.opacity = '1';
            setTimeout(() => {
                saveStatus.style.opacity = '0';
            }, 1000);
        }

        // --- Tools & Actions ---

        function formatText(syntax) {
            const start = editor.selectionStart;
            const end = editor.selectionEnd;
            const text = editor.value;
            const before = text.substring(0, start);
            const selected = text.substring(start, end);
            const after = text.substring(end);

            // If no text selected, just insert the syntax placeholders
            if (start === end) {
                const insertion = `${syntax}texto${syntax}`;
                editor.value = before + insertion + after;
                handleInput();
                editor.focus();
                // Move cursor to "texto"
                editor.selectionStart = start + syntax.length;
                editor.selectionEnd = start + syntax.length + 5;
                return;
            }

            // Wrap selection
            editor.value = before + syntax + selected + syntax + after;
            handleInput();
            editor.focus();
        }

        function clearEditor() {
            if (confirm('Limpar todo o conteúdo desta nota?')) {
                editor.value = '';
                handleInput();
                editor.focus();
            }
        }

        function copyContent() {
            editor.select();
            document.execCommand('copy'); // Robust fallback
            alert('Conteúdo Markdown copiado!');
        }

        function saveAsFile() {
            if (!activeNoteId) return;
            const note = notes.find(n => n.id === activeNoteId);
            
            const blob = new Blob([note.content], { type: 'text/markdown' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            // Sanitize filename
            const safeTitle = note.title.replace(/[^a-z0-9]/gi, '_').toLowerCase();
            a.download = `${safeTitle}.md`;
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
            document.body.removeChild(a);
        }

        // --- Find & Replace ---

        function toggleFindReplace() {
            const panel = document.getElementById('findReplacePanel');
            panel.classList.toggle('hidden');
            if (!panel.classList.contains('hidden')) {
                document.getElementById('findInput').focus();
            }
        }

        function executeReplace() {
            const findText = document.getElementById('findInput').value;
            const replaceText = document.getElementById('replaceInput').value;

            if (!findText) return;

            const content = editor.value;
            // Global search using regex, escaping special regex chars in the input
            const regex = new RegExp(findText.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g');
            
            const newContent = content.replace(regex, replaceText);
            
            if (newContent !== content) {
                editor.value = newContent;
                handleInput();
                alert('Substituição concluída!');
            } else {
                alert('Nenhuma ocorrência encontrada.');
            }
        }
        
        // Keyboard Shortcuts
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault(); // Prevent browser save dialog
                saveToStorage(); // Already automatic, but gives user feedback
            }
            if ((e.ctrlKey || e.metaKey) && e.key === 'b') {
                e.preventDefault();
                formatText('**');
            }
            if ((e.ctrlKey || e.metaKey) && e.key === 'i') {
                e.preventDefault();
                formatText('*');
            }
        });

    </script>
</body>
</html>
